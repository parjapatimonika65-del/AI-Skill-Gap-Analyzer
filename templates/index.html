<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Skill Gap Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='script.js') }}"
            defer></script>
</head>

<body>

<header>

    <div class="logo">
        AI Skill Gap Analyzer
    </div>

</header>


<main class="container">

    <section class="hero">

        <h1>Find Your Skill Gap</h1>

        <p>
            Enter your skills or upload your resume
            to discover your skill gap.
        </p>

    </section>


    {% if error %}

    <div class="error-message">
        {{ error }}
    </div>

    {% endif %}


    <section class="card">

        <form action="/analyze"
              method="POST"
              enctype="multipart/form-data"
              onsubmit="return validateForm()">


            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="target_role">
                Target Job Role
            </label>

            <select
                id="target_role"
                name="target_role"
                required
            >

                <option value="">
                    Select Job Role
                </option>

                <option value="Data Analyst">
                    Data Analyst
                </option>

                <option value="Full Stack Developer">
                    Full Stack Developer
                </option>

                <option value="Data Scientist">
                    Data Scientist
                </option>

                <option value="Frontend Developer">
                    Frontend Developer
                </option>

                <option value="Backend Developer">
                    Backend Developer
                </option>

            </select>


            <label for="skills">
                Your Current Skills
            </label>

            <textarea
                id="skills"
                name="skills"
                placeholder="Example: Python, SQL, Excel"
            ></textarea>

            <small>
                Optional if you upload your resume.
                Enter skills separated by commas.
            </small>


            <label for="resume">
                📄 Upload Resume (PDF)
            </label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,application/pdf"
            >

            <small>
                Upload a text-based PDF resume.
                Maximum size: 5 MB.
            </small>


            <button type="submit">
                Analyze My Skills
            </button>

        </form>

    </section>

</main>

</body>

</html>
